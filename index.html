<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <meta
      name="description"
      content="元素記号クイズで元素の名前を楽しく覚えよう。"
    />
    <title>元素記号ゲーム</title>
    <link rel="stylesheet" href="styles.css?v=20261029-2" />
    <script src="app.js?v=20261029-2" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="元素記号ゲーム ホーム">
          <span>元素記号ゲーム</span>
        </a>
      </header>

      <main>
        <section class="dashboard-card" aria-label="学習レベルと学習状況">
          <div class="level-picker" aria-labelledby="level-heading">
            <div class="level-heading">
              <h2 id="level-heading">学習レベル</h2>
            </div>
            <div class="level-options" role="group" aria-label="学習レベル">
              <button class="level-button is-active" type="button" data-level="basic" aria-pressed="true">
                <span class="level-name">基礎</span>
              </button>
              <button class="level-button" type="button" data-level="intermediate" aria-pressed="false">
                <span class="level-name">中級</span>
              </button>
              <button class="level-button" type="button" data-level="advanced" aria-pressed="false">
                <span class="level-name">上級</span>
              </button>
            </div>
          </div>
          <div class="stats" aria-label="学習状況">
            <article class="stat-card">
              <p class="stat-label">クイズ正解数</p>
              <p class="stat-value"><span id="correct-count">0</span><span class="stat-unit"> 問</span></p>
            </article>
          </div>
        </section>

        <nav class="tabs" aria-label="学習メニュー">
          <button class="tab-button is-active" type="button" data-view="quiz" aria-selected="true"><span aria-hidden="true">◉</span> クイズ</button>
          <button class="tab-button" type="button" data-view="table" aria-selected="false"><span aria-hidden="true">▦</span> 周期表</button>
        </nav>

        <section class="view-panel" id="quiz-view" aria-labelledby="quiz-heading">
          <div class="section-heading">
            <div>
              <h2 id="quiz-heading">クイズに挑戦</h2>
            </div>
            <div class="question-counter" id="question-counter" aria-live="polite">1 <span>/ 10</span></div>
          </div>
          <div class="quiz-progress" aria-hidden="true"><span id="quiz-progress-bar"></span></div>
          <div class="quiz-card" id="quiz-card">
            <div class="quiz-card-top"><span class="quiz-mode">元素記号から選ぼう</span><span class="atomic-number" id="quiz-atomic-number">No. 01</span></div>
            <div class="quiz-prompt">この元素の名前は？</div>
            <div class="quiz-symbol" id="quiz-symbol">H</div>
            <div class="quiz-choices" id="quiz-choices" role="group" aria-label="答えを選択"></div>
            <div class="quiz-answer-actions">
              <div class="quiz-feedback" id="quiz-feedback" aria-live="polite"></div>
              <button class="primary-button next-question" id="next-question" type="button" hidden>次の問題 <span aria-hidden="true">→</span></button>
            </div>
            <div class="quiz-feature" id="quiz-feature" hidden></div>
          </div>
          <p class="helper-text">10問チャレンジ。何度でも挑戦できます。</p>
        </section>

        <section class="view-panel" id="table-view" aria-labelledby="table-heading" hidden>
          <div class="section-heading">
            <div>
              <h2 id="table-heading">元素周期表</h2>
            </div>
            <div class="question-counter">1–18 <span>族</span></div>
          </div>
          <div class="table-legend" aria-label="元素の分類">
            <span><i class="legend-swatch family-alkali"></i>アルカリ金属</span>
            <span><i class="legend-swatch family-alkaline"></i>アルカリ土類</span>
            <span><i class="legend-swatch family-transition"></i>遷移金属</span>
            <span><i class="legend-swatch family-post-transition"></i>その他の金属</span>
            <span><i class="legend-swatch family-metalloid"></i>半金属</span>
            <span><i class="legend-swatch family-nonmetal"></i>非金属</span>
            <span><i class="legend-swatch family-halogen"></i>ハロゲン</span>
            <span><i class="legend-swatch family-noble"></i>希ガス</span>
            <span><i class="legend-swatch family-lanthanide"></i>ランタノイド</span>
            <span><i class="legend-swatch family-actinide"></i>アクチノイド</span>
          </div>
          <div class="periodic-detail" id="periodic-detail" aria-live="polite">
            <span class="detail-symbol">—</span>
            <span class="detail-copy">元素を選ぶと、英語名・族・周期を表示します。</span>
          </div>
          <p class="table-hint">元素をタップして詳細を表示。スマートフォンでは左右にスクロールできます。</p>
          <div class="periodic-scroll" tabindex="0" aria-label="周期表。左右にスクロールできます">
            <div class="periodic-table" id="periodic-table"></div>
          </div>
          <div class="series-label">ランタノイド（57–71）</div>
          <div class="periodic-scroll series-scroll" tabindex="0" aria-label="ランタノイド系列">
            <div class="series-table" id="lanthanide-series"></div>
          </div>
          <div class="series-label">アクチノイド（89–103）</div>
          <div class="periodic-scroll series-scroll" tabindex="0" aria-label="アクチノイド系列">
            <div class="series-table" id="actinide-series"></div>
          </div>
        </section>
      </main>

      <footer class="footer"><span>元素記号ゲーム</span><span>全118元素を収録</span></footer>
    </div>
  </body>
</html>
